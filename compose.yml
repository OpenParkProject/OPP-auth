services:
  backend:
    build:
      context: .
      dockerfile: Containerfile.dev
    environment:
      - DEBUG_MODE=true
    volumes:
      - .:/src/
    ports:
      - "8090:8090"
    depends_on:
      - postgres
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
